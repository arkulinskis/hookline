<div class="lc-host">
  <div class="lb-item">
    <div class="meta" anvil:dom-node="top"><b anvil:dom-node="title"></b><span anvil:dom-node="sub"></span></div>
    <p class="lb-main" anvil:dom-node="main"></p>
    <p class="small muted lb-extra" anvil:dom-node="extra"></p>
    <div class="meta">
      <span class="lb-sc" anvil:dom-node="score"></span><span anvil:dom-node="tag"></span><span anvil:dom-node="len"></span>
      <span class="ui-spacer"></span>
      <anvil-component type="Button" name="copy_button" prop:text="Copy" prop:role='["btn", "btn-sm", "btn-ghost", "ic-copy"]'></anvil-component>
      <anvil-component type="Button" name="start_button" prop:text="Start a post" prop:role='["btn", "btn-sm", "ic-pen"]'></anvil-component>
    </div>
    <div class="lb-fold" anvil:dom-node="fold"></div>
  </div>
</div>
