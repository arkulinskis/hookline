<div class="se-host">
  <div class="cr-slide" anvil:name="box">
    <div class="hd">
      <b anvil:dom-node="label"></b><span class="ui-spacer"></span>
      <anvil-component type="Button" name="up_button" prop:text="Move up" prop:role='["btn", "btn-ghost", "btn-icon", "btn-sm", "ic-up"]'></anvil-component>
      <anvil-component type="Button" name="down_button" prop:text="Move down" prop:role='["btn", "btn-ghost", "btn-icon", "btn-sm", "ic-down"]'></anvil-component>
      <anvil-component type="Button" name="rm_button" prop:text="Delete slide" prop:role='["btn", "btn-ghost", "btn-icon", "btn-sm", "ic-trash"]'></anvil-component>
    </div>
    <anvil-component type="TextBox" name="title_box"></anvil-component>
    <anvil-component type="TextArea" name="body_box" prop:placeholder="Body (optional)"></anvil-component>
  </div>
</div>
